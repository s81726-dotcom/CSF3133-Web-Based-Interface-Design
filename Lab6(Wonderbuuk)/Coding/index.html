<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Web Development Quiz</h1>
        <p>Test your knowledge!</p>
    </header>

    <main>
        <section id="quiz-section">
            <div id="timer-container">
                Time Left: <span id="timer">15</span>s
            </div>
            
            <div id="question-container">
                <h2 id="question-text">Question text goes here</h2>
                <div id="options-container" class="options-grid">
                </div>
            </div>

            <div id="feedback-container" class="hidden">
                <p id="feedback-text"></p>
            </div>

            <div id="controls">
                <button id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden">Next Question</button>
            </div>
        </section>

        <section id="result-section" class="hidden">
            <h2>Quiz Completed!</h2>
            <p>Your Score: <span id="score-display">0</span> / <span id="total-questions">0</span></p>
            <button onclick="location.reload()">Restart Quiz</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Lab Exercise 6(Wonderbuuk). S81726.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
