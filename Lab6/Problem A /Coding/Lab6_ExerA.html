<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        
        <!-- HEADER -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
        </header>

        <!-- PLAYER SECTION -->
        <section id="player-section" class="card">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="">
            <button onclick="startGame()">Start Game</button>
            <span id="welcome"></span>
        </section>

        <!-- GAME SECTION -->
        <section class="game-section card">
            <div class="choices">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="arena">
                <div class="side">
                    <p><strong>You</strong></p>
                    <img id="playerImg" src="rock.png" alt="Your choice">
                </div>

                <div class="vs">VS</div>

                <div class="side">
                    <p><strong>Computer</strong></p>
                    <img id="computerImg" src="rock.png" alt="Computer choice">
                </div>
            </div>
        </section>

        <!-- RESULT SECTION -->
        <section class="result-section card">
            <p id="result"></p>
            <p class="scoreboard">
                Wins: <span id="wins">0</span> &nbsp; Losses: <span id="losses">0</span> &nbsp; Draws: <span id="draws">0</span>
            </p>
        </section>

        <!-- HISTORY SECTION -->
        <section class="history-section card">
            <h2>History</h2>
            <table id="history">
                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                </tbody>
            </table>
            
            <div class="controls">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>
        </section>

        <!-- FOOTER -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Rock, Paper, Scissors. S81726</p>
        </footer>

    </div>

    <script src="game.js"></script>
</body>
</html>
